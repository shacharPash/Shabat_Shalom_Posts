name: Omer Reminder

on:
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:
    inputs:
      resume_cursor:
        description: 'Opaque cursor from a failed run (leave empty for normal start)'
        required: false
        type: string
      restart_traversal:
        description: 'Explicitly start a fresh traversal after saved pages expire'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: omer-reminder
  cancel-in-progress: false

jobs:
  send-reminders:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Send bounded reminder batches
        env:
          VERCEL_URL: ${{ secrets.VERCEL_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          RESUME_CURSOR: ${{ inputs.resume_cursor }}
          RESTART_TRAVERSAL: ${{ inputs.restart_traversal }}
          REMINDER_ENDPOINT: omer_reminder
        run: python3 .github/scripts/run_reminders.py

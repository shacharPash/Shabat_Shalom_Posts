name: CI

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-check:
    name: Python 3.12 release checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated Redis test prerequisite
        run: sudo apt-get update && sudo apt-get install -y redis-server
      - name: Install locked dependencies
        run: python -m pip install --require-hashes -r requirements-dev.txt
      - name: Verify dependency consistency
        run: python -m pip check
      - name: Run all regressions with offline service boundaries
        run: python run_tests.py -q
      - name: Required core lint
        run: python -m ruff check .
      - name: Required maintained-module type checks
        run: python -m mypy
      - name: Audit locked runtime and development dependencies
        run: python -m pip_audit --require-hashes --disable-pip -r requirements-dev.txt

  audit-diagnostic:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      chunks: ${{ steps.audit.outputs.chunks }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - run: python -m pip install --require-hashes -r requirements-dev.txt
      - id: audit
        shell: python
        run: |
          import json, os, subprocess, urllib.request
          from packaging.version import Version
          result = subprocess.run(["python", "-m", "pip_audit", "--require-hashes", "--disable-pip", "-r", "requirements-dev.txt", "--format", "json"], capture_output=True, text=True)
          report = json.loads(result.stdout)
          updates = []
          for dependency in report["dependencies"]:
              if not dependency.get("vulns"):
                  continue
              fixes = {v for finding in dependency["vulns"] for v in finding.get("fix_versions", [])}
              if not fixes:
                  updates.append({"name": dependency["name"], "error": "no fixed version", "vulns": dependency["vulns"]})
                  continue
              version = max(fixes, key=Version)
              if dependency["name"] == "certifi":
                  version = "2026.10.19"
              with urllib.request.urlopen("https://pypi.org/pypi/" + dependency["name"] + "/" + version + "/json") as response:
                  release = json.load(response)
              updates.append({"name": dependency["name"], "old": dependency["version"], "version": version, "requires_dist": release["info"].get("requires_dist"), "hashes": sorted({f["digests"]["sha256"] for f in release["urls"]})})
          data = json.dumps(updates, separators=(",", ":"))
          chunks = [{"index": i // 880, "text": data[i:i+880]} for i in range(0, len(data), 880)]
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("chunks=" + json.dumps(chunks) + "\n")
  audit-diagnostic-result:
    needs: audit-diagnostic
    strategy:
      matrix:
        chunk: ${{ fromJSON(needs.audit-diagnostic.outputs.chunks) }}
    name: "audit-data-${{ matrix.chunk.index }}:${{ matrix.chunk.text }}"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - run: echo "Temporary public package metadata diagnostic completed"

name: CI

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-check:
    name: Python 3.12 release checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated Redis test prerequisite
        run: sudo apt-get update && sudo apt-get install -y redis-server
      - name: Install locked dependencies
        run: python -m pip install --require-hashes -r requirements-dev.txt
      - name: Verify dependency consistency
        run: python -m pip check
      - name: Run all regressions with offline service boundaries
        run: python run_tests.py -q
      - name: Required core lint
        run: python -m ruff check .
      - name: Required maintained-module type checks
        run: python -m mypy
      - name: Audit locked runtime and development dependencies
        run: python -m pip_audit --require-hashes --disable-pip -r requirements-dev.txt

  audit-diagnostic:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      summary: ${{ steps.audit.outputs.summary }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - run: python -m pip install --require-hashes -r requirements-dev.txt
      - id: audit
        shell: python
        run: |
          import json, os, subprocess
          result = subprocess.run(["python", "-m", "pip_audit", "--require-hashes", "--disable-pip", "-r", "requirements-dev.txt", "--format", "json"], capture_output=True, text=True)
          try:
              report = json.loads(result.stdout)
              affected = [{"name": d["name"], "version": d.get("version"), "vulns": d.get("vulns"), "skip_reason": d.get("skip_reason")} for d in report["dependencies"] if d.get("vulns") or d.get("skip_reason")]
              summary = json.dumps(affected, ensure_ascii=True)
          except (ValueError, KeyError):
              summary = result.stdout
          summary = ("exit=" + str(result.returncode) + " " + summary + " " + result.stderr).replace("\n", " ").replace("\r", " ")[:3000]
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("summary=" + summary + "\n")
  audit-diagnostic-result:
    needs: audit-diagnostic
    name: ${{ needs.audit-diagnostic.outputs.summary }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - run: echo "Temporary audit diagnostic completed"

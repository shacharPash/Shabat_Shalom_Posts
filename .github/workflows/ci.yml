name: CI

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-check:
    name: Python 3.12 release checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated Redis test prerequisite
        run: sudo apt-get update && sudo apt-get install -y redis-server
      - name: Install locked dependencies
        run: python -m pip install --require-hashes -r requirements-dev.txt
      - name: Verify dependency consistency
        run: python -m pip check
      - name: Run all regressions with offline service boundaries
        run: python run_tests.py -q
      - name: Required core lint
        run: python -m ruff check .
      - name: Required maintained-module type checks
        run: python -m mypy
      - name: Audit locked runtime and development dependencies
        run: python -m pip_audit --require-hashes --disable-pip -r requirements-dev.txt

  verify-lockfiles:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      result: ${{ steps.verify.outputs.result }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - run: python -m pip install --require-hashes -r requirements-dev.txt
      - run: python -m piptools compile --generate-hashes --strip-extras --allow-unsafe --index-url https://pypi.org/simple -o requirements.txt requirements.in
      - run: python -m piptools compile --generate-hashes --strip-extras --allow-unsafe --index-url https://pypi.org/simple -o requirements-dev.txt requirements-dev.in
      - id: verify
        shell: python
        run: |
          import json, os, subprocess
          diff = subprocess.run(["git", "diff", "--ignore-matching-lines=^#", "--", "requirements.txt", "requirements-dev.txt"], capture_output=True, text=True).stdout
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("result=" + ("Lockfiles reproduced by pip-compile" if not diff else diff.replace("\n", " ")[:900]) + "\n")
          if diff:
              print(diff)
              raise SystemExit(1)
  lockfile-verification-result:
    if: always()
    needs: verify-lockfiles
    name: ${{ needs.verify-lockfiles.outputs.result || 'Lockfile regeneration failed' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - run: echo "Temporary lockfile verification completed"

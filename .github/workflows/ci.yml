name: CI

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-check:
    name: Python 3.12 release checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install isolated Redis test prerequisite
        run: sudo apt-get update && sudo apt-get install -y redis-server
      - name: Install locked dependencies
        run: python -m pip install --require-hashes -r requirements-dev.txt
      - name: Verify dependency consistency
        run: python -m pip check
      - name: Run all regressions with offline service boundaries
        run: python run_tests.py -q
      - name: Required core lint
        run: python -m ruff check .
      - name: Required maintained-module type checks
        run: python -m mypy
      - name: Audit locked runtime and development dependencies
        run: python -m pip_audit --require-hashes --disable-pip -r requirements-dev.txt

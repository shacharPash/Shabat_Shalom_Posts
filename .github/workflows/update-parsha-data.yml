name: Update Parsha Data

on:
  schedule:
    - cron: '0 0 1 1 *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update-parsha:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - name: Install locked runtime
        run: python -m pip install --require-hashes -r requirements.txt
      - name: Validate all years and replace fallback atomically
        run: python scripts/update_parsha_data.py
      - name: Upload validated data for a reviewed change
        uses: actions/upload-artifact@v7
        with:
          name: validated-israel-parsha-data
          path: parsha_data.json
          if-no-files-found: error
          retention-days: 30
